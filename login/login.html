<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <script>
        if (localStorage.getItem('isAuth') === 'true') location.replace('../dashboard/dashboard.html');
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <meta name="description"
        content="Log in with your full name or email, or continue with Google, GitHub or Apple. A responsive, accessible login form built with HTML, CSS and JavaScript.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style/style.css">
</head>

<body>
    <main class="auth">
        <h1 class="auth__title">Login</h1>
        <form id="loginForm" class="auth__form" novalidate>
            <div class="auth__field">
                <input type="text" id="username" class="auth__input" autocomplete="username" placeholder=" " required
                    aria-describedby="usernameError" aria-invalid="false">
                <label for="username" class="auth__label">Full name or Email</label>
                <p class="auth__error-text" id="usernameError" role="alert"></p>
            </div>

            <div class="auth__field">
                <input type="password" id="password" class="auth__input auth__input--has-toggle"
                    autocomplete="current-password" placeholder=" " required aria-describedby="passwordError"
                    aria-invalid="false">
                <label for="password" class="auth__label">Password</label>
                <button type="button" class="auth__toggle-pwd" aria-label="Show password" data-toggle="password">
                    <svg class="pwd-icon pwd-icon--show" viewBox="0 0 24 24" fill="none" aria-hidden="true" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                    <svg class="pwd-icon pwd-icon--hide" viewBox="0 0 24 24" fill="none" aria-hidden="true" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path
                            d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24">
                        </path>
                        <line x1="1" y1="1" x2="23" y2="23"></line>
                    </svg>
                </button>
                <p class="auth__error-text" id="passwordError" role="alert"></p>
            </div>

            <div class="auth__form-options">
                <a href="../forgot-password/forgot-password.html" class="auth__forgot-link">Forgot password?</a>
            </div>

            <p class="auth__message" id="formMessage" aria-live="polite"></p>
            <button type="submit" class="auth__submit-btn">Submit</button>
        </form>

        <div class="auth__divider" role="separator" aria-label="or">
            <span class="auth__divider-text">or</span>
        </div>

        <div class="auth__oauth">
            <button type="button" class="auth__oauth-btn" data-provider="Google">
                <svg class="auth__oauth-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path fill="#4285F4"
                        d="M23.745 12.27c0-.79-.07-1.54-.19-2.27h-11.3v4.51h6.47c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.54-5.17 3.54-8.97z" />
                    <path fill="#34A853"
                        d="M12.255 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.11-6.72-4.96h-4.01v3.14C3.505 21.3 7.565 24 12.255 24z" />
                    <path fill="#FBBC05"
                        d="M5.535 14.24c-.24-.72-.38-1.49-.38-2.24s.14-1.52.38-2.24V6.62h-4.01C.555 8.56 0 10.72 0 12s.555 3.44 1.525 5.38l4.01-3.14z" />
                    <path fill="#EA4335"
                        d="M12.255 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C18.205 1.19 15.495 0 12.255 0 7.565 0 3.505 2.7 1.525 6.62l4.01 3.14c.95-2.85 3.6-4.96 6.72-4.96z" />
                </svg>
                <span>Continue with Google</span>
            </button>

            <button type="button" class="auth__oauth-btn" data-provider="GitHub">
                <svg class="auth__oauth-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path fill-rule="evenodd" clip-rule="evenodd"
                        d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z" />
                </svg>
                <span>Continue with GitHub</span>
            </button>

            <button type="button" class="auth__oauth-btn" data-provider="Apple">
                <svg class="auth__oauth-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path
                        d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z" />
                </svg>
                <span>Continue with Apple</span>
            </button>
        </div>

        <p class="auth__switch">
            Don't have an account? <a href="../signup/signup.html" class="auth__link">Sign up</a>
        </p>
        <p class="auth__hint">Demo account: demo / Password123!</p>
    </main>

    <script src="login.js"></script>
</body>

</html>
