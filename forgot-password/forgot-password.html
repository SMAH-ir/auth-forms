<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <script>
          if (localStorage.getItem('isAuth') === 'true') location.replace('../dashboard/dashboard.html');
     </script>
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Forgot Password</title>
     <meta name="description"
          content="Reset your password by entering your email address. A simple, accessible password recovery form built with HTML, CSS and JavaScript.">
     <link rel="preconnect" href="https://fonts.googleapis.com">
     <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
     <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
     <link rel="stylesheet" href="../style/style.css">
</head>

<body>
     <main class="auth">
          <h1 class="auth__title">Reset Password</h1>
          <p class="auth__text">Enter your email address and we'll send you a link to reset your password.</p>

          <form id="forgotForm" class="auth__form" novalidate>
               <div class="auth__field">
                    <input type="email" id="email" class="auth__input" autocomplete="email" placeholder=" " required
                         aria-describedby="emailError" aria-invalid="false">
                    <label for="email" class="auth__label">Email</label>
                    <p class="auth__error-text" id="emailError" role="alert"></p>
               </div>

               <p class="auth__message" id="formMessage" aria-live="polite"></p>
               <button type="submit" class="auth__submit-btn">Send Reset Link</button>
          </form>

          <p class="auth__switch">
               Remember your password? <a href="../login/login.html" class="auth__link">Log in</a>
          </p>
     </main>

     <script src="forgot-password.js"></script>
</body>

</html>
